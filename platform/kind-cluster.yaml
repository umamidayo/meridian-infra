# Local Kubernetes for the observability platform (kind v0.33.0).
# NodePorts are published on 127.0.0.1 only.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: meridian
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30030 # Grafana
        hostPort: 3000
        listenAddress: 127.0.0.1
      - containerPort: 30090 # Prometheus
        hostPort: 9090
        listenAddress: 127.0.0.1
      - containerPort: 30080 # Argo CD
        hostPort: 8088
        listenAddress: 127.0.0.1
