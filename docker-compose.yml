services:
  localstack:
    image: localstack/localstack:2026.10.4@sha256:2290500d7398e6458544fab2f49aaf170b81a1006ee69067e8e7fc59b810a824
    ports:
      - "4566:4566"
    environment:
      # Current LocalStack images require an auth token (the free tier is enough); export LOCALSTACK_AUTH_TOKEN before `docker compose up`.
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      SERVICES: s3,ec2,iam,sts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
