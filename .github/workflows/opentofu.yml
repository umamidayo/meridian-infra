name: OpenTofu

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opentofu-${{ github.ref }}
  cancel-in-progress: false

env:
  TOFU_VERSION: 1.13.0
  LOCALSTACK_ENDPOINT: http://localhost:4566
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: tofu fmt
        run: tofu fmt -check -recursive -diff

      - name: tofu validate
        run: |
          tofu init -backend=false
          tofu validate

  plan-apply:
    name: ${{ github.event_name == 'pull_request' && 'Plan' || 'Plan and apply' }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Start LocalStack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          if [ -z "$LOCALSTACK_AUTH_TOKEN" ]; then
            echo "::error title=Missing secret::LOCALSTACK_AUTH_TOKEN is empty. Add it under Settings > Secrets and variables > Actions > Repository secrets. LocalStack exits on startup without it."
            exit 1
          fi

          docker run -d --name localstack -p 4566:4566 \
            -e LOCALSTACK_AUTH_TOKEN \
            -e SERVICES=s3,ec2,iam,sts \
            -v /var/run/docker.sock:/var/run/docker.sock \
            localstack/localstack:latest

          # Fail fast with LocalStack's own error (e.g. license activation) instead of timing out on the port.
          for _ in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Running}}' localstack)" != "true" ]; then
              docker logs localstack 2>&1 | tail -40
              code=$(docker inspect -f '{{.State.ExitCode}}' localstack)
              echo "::error title=LocalStack exited::LocalStack stopped with exit code $code. Exit code 55 means license activation failed: check that LOCALSTACK_AUTH_TOKEN is valid and allowed for CI use."
              exit 1
            fi
            if curl -fsS http://localhost:4566/_localstack/health >/dev/null 2>&1; then
              echo "LocalStack is ready."
              exit 0
            fi
            sleep 2
          done
          docker logs localstack 2>&1 | tail -40
          echo "::error title=LocalStack timeout::LocalStack did not become healthy within 180s."
          exit 1

      - name: Bootstrap state bucket
        run: bash scripts/bootstrap-state.sh

      - name: tofu init
        run: tofu init

      - name: tofu plan
        run: |
          tofu plan -out=tfplan
          {
            echo '## OpenTofu plan'
            echo '```'
            tofu show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: tofu apply
        if: github.event_name != 'pull_request'
        run: tofu apply -auto-approve tfplan

      - name: Outputs
        if: github.event_name != 'pull_request'
        run: |
          tofu output
          {
            echo '## Outputs'
            echo '```json'
            tofu output -json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: LocalStack logs
        if: failure()
        run: docker logs localstack | tail -200
